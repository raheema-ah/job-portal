version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: job_portal_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=job_portal

  # Backend REST API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_portal_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/job_portal
      - JWT_SECRET=super_secret_jwt_key_job_portal_2026_secure
      - JWT_EXPIRES_IN=7d
      - SCRAPER_SCHEDULE=0 */6 * * *
    depends_on:
      - mongodb

volumes:
  mongo_data:
    driver: local
