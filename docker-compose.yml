version: '3.9'

services:
  # ================================
  # MongoDB Database
  # ================================
  mongodb:
    image: mongo:7
    container_name: job-portal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-jobportal2026}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-jobportal}
    volumes:
      - mongo_data:/data/db
    networks:
      - job-portal-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # Backend API Server
  # ================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-portal-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-jobportal2026}@mongodb:27017/${MONGO_DB_NAME:-jobportal}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_job_portal_2026_secure_docker}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@jobportal.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SCRAPER_SCHEDULE: ${SCRAPER_SCHEDULE:-0 */6 * * *}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - job-portal-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ================================
  # Frontend (Nginx)
  # ================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job-portal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - job-portal-net

# ================================
# Volumes & Networks
# ================================
volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  job-portal-net:
    driver: bridge
